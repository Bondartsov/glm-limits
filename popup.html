<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM Limits</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="18" height="18">
            <rect width="18" height="18" rx="5" class="mark-bg"/>
            <rect x="3.6" y="9.2" width="2.7" height="5.2" rx="1.35" fill="#ffffff" opacity="0.7"/>
            <rect x="7.65" y="6.2" width="2.7" height="8.2" rx="1.35" fill="#ffffff" opacity="0.85"/>
            <rect x="11.7" y="3.6" width="2.7" height="10.8" rx="1.35" fill="#ffffff"/>
          </svg>
        </span>
        <span class="name" data-i18n="brand">GLM Limits</span>
      </div>
      <div class="actions">
        <button id="refresh" class="btn-icon" title="Refresh" data-i18n-title="refresh">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button id="compact" class="btn-icon" title="Compact view" data-i18n-title="compact">
          <svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button id="pin" class="btn-icon" title="Pin on top" data-i18n-title="pin">
          <svg viewBox="0 0 24 24"><line x1="12" y1="15.5" x2="12" y2="21.5"/><path d="M8.5 3.5h7l-.9 7.2 2.9 2.8H6.5l2.9-2.8-.9-7.2z"/></svg>
        </button>
        <button id="popout" class="btn-icon" title="Open in window" data-i18n-title="popout">
          <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </button>
        <button id="settings" class="btn-icon" title="Settings" data-i18n-title="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Status line -->
    <div class="status" id="status">
      <span class="dot offline"></span>
      <span class="status-text" data-i18n="statusOffline">Offline</span>
    </div>

    <!-- Main content -->
    <main class="content" id="content">
      <!-- Loading state -->
      <div class="loading" id="loading" data-i18n="loading">Loading…</div>

      <!-- Full view -->
      <div class="full-view" id="fullView">
        <!-- Primary metric: session (5h) -->
        <div class="metric primary" id="metricSession">
          <div class="metric-label" data-i18n="sessionLeft">Left · session (5h)</div>
          <div class="metric-value">
            <span class="pct" id="sessionPct">—</span><span class="pct-unit">%</span>
          </div>
          <div class="metric-anno" id="sessionAnno"></div>
          <div class="bar-track"><div class="bar-fill" id="sessionBar"></div></div>
          <svg class="spark" id="sessionSpark" viewBox="0 0 328 26" preserveAspectRatio="none" style="display:none"></svg>
          <div class="reset" id="sessionReset"></div>
        </div>

        <!-- Secondary metric: weekly -->
        <div class="metric" id="metricWeekly">
          <div class="metric-label" data-i18n="weeklyLeft">Left · weekly</div>
          <div class="metric-value">
            <span class="pct" id="weeklyPct">—</span><span class="pct-unit">%</span>
          </div>
          <div class="metric-anno" id="weeklyAnno"></div>
          <div class="bar-track"><div class="bar-fill" id="weeklyBar"></div></div>
          <svg class="spark" id="weeklySpark" viewBox="0 0 328 26" preserveAspectRatio="none" style="display:none"></svg>
          <div class="reset" id="weeklyReset"></div>
        </div>

        <!-- Optional: MCP usage -->
        <div class="metric optional" id="metricMcp" style="display:none">
          <div class="metric-label" data-i18n="mcpLeft">Left · MCP</div>
          <div class="metric-value">
            <span class="pct" id="mcpPct">—</span><span class="pct-unit">%</span>
          </div>
          <div class="metric-anno" id="mcpAnno"></div>
          <div class="bar-track"><div class="bar-fill" id="mcpBar"></div></div>
          <div class="reset" id="mcpReset"></div>
        </div>

        <!-- Plan badge -->
        <div class="plan-badge" id="planBadge"></div>
      </div>

      <!-- Compact view -->
      <div class="compact-view" id="compactView" style="display:none">
        <div class="chip" id="chipSession">
          <span class="chip-label" data-i18n="session">Session</span>
          <span class="chip-pct" id="chipSessionPct">—</span>
        </div>
        <div class="chip" id="chipWeekly">
          <span class="chip-label" data-i18n="weekly">Weekly</span>
          <span class="chip-pct" id="chipWeeklyPct">—</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer" style="display:none">
      <div class="foot-row">
        <span class="foot-key" data-i18n="footWhen">Resets</span>
        <span class="foot-val" id="footReset">—</span>
      </div>
      <div class="foot-row">
        <span class="foot-key" data-i18n="footSource">Source</span>
        <span class="foot-val" id="footSource">—</span>
      </div>
    </footer>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel" style="display:none">
      <h3 data-i18n="settings">Settings</h3>

      <div class="field">
        <label data-i18n="apiKey">API Key</label>
        <input type="password" id="apiKeyInput" placeholder="glm_… / zai_…">
        <small data-i18n="apiKeyHint">Your GLM Coding Plan API key. Never shared.</small>
      </div>

      <div class="field">
        <label data-i18n="platform">Platform</label>
        <select id="platformSelect">
          <option value="auto" data-i18n="platformAuto">Auto</option>
          <option value="cn" data-i18n="platformCn">China · open.bigmodel.cn</option>
          <option value="intl" data-i18n="platformIntl">International · api.z.ai</option>
        </select>
        <small data-i18n="platformHint">Auto detects the site from your key.</small>
      </div>

      <div class="field">
        <label data-i18n="interval">Refresh interval (sec)</label>
        <input type="number" id="intervalInput" min="30" max="3600" value="120">
      </div>

      <div class="field">
        <label data-i18n="viewMode">View mode</label>
        <select id="viewModeSelect">
          <option value="popup" data-i18n="viewPopup">Popup</option>
          <option value="window" data-i18n="viewWindow">Window</option>
          <option value="compact" data-i18n="viewCompact">Compact</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="language">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="theme">Theme</label>
        <select id="themeSelect">
          <option value="light" data-i18n="themeLight">Light</option>
          <option value="dark" data-i18n="themeDark">Dark</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="showMcp">Show MCP usage</label>
        <input type="checkbox" id="showMcpCheck">
      </div>

      <div class="field">
        <label data-i18n="notifyLabel">Notify at 80/90% of session</label>
        <input type="checkbox" id="notifyCheck">
      </div>

      <div class="field">
        <label data-i18n="badgeLabel">Show percent on icon</label>
        <input type="checkbox" id="badgeCheck">
      </div>

      <div class="field" id="badgeMetricField">
        <label data-i18n="badgeMetricLabel">Icon shows</label>
        <select id="badgeMetricSelect">
          <option value="s" data-i18n="session">Session (5h)</option>
          <option value="w" data-i18n="weekly">Weekly</option>
        </select>
      </div>

      <div class="field" id="badgeModeField">
        <label data-i18n="badgeModeLabel">Show as</label>
        <select id="badgeModeSelect">
          <option value="remaining" data-i18n="badgeModeRemaining">Left</option>
          <option value="used" data-i18n="badgeModeUsed">Used</option>
        </select>
      </div>

      <div class="actions-row">
        <button id="saveSettings" class="btn-primary" data-i18n="save">Save</button>
        <button id="resetSettings" class="btn-ghost" data-i18n="reset">Reset</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
